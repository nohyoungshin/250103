<!DOCTYPE html>
<html>

<head>
    <title>Page Title</title>

    <style>
        /*reset*/
        * {
            margin: 0;
            box-sizing: border-box;
        }

        ul,
        ol,
        li {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav {
            width: 1000px;
            background-color: red;
            height: 40px;
            float: left;
            margin: 50px 80px 0 30px;
        }

        .menu {
            font-size: 17px;
            font-weight: bold;
            margin: 10px 80px 0 0px;
            float: left;
        }

        .menu>li {
            float: left;
            margin: 0 60px 0 40px;
            transition: all 0.5s ease;
            line-height: 40px;
        }

        .menu>li>a {
            color: #000;
            text-decoration: none;
        }

        .menu>li:hover a {
            color: #666;
        }

        .menu>li>.sub {
            background-color: pink;
            display: none;
            z-index: 10;
            position: relative;
        }


    </style>

    <script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.7.0.min.js"></script>
    <script>
        $(function () {

            $('.menu > li').mouseover(function () {

                $('.sub').stop().slideDown();

            }).mouseout(function () {

                $('.sub').stop().slideUp();

            });

        });
    </script>
</head>

<body>

    <nav>

        <ul class="menu">

            <li><a href="#">홈</a></li>

            <li><a href="#">가구</a>

                <ul class="sub">

                    <li><a href="#">거실</a></li>

                    <li><a href="#">주방</a></li>

                    <li><a href="#">오피스</a></li>

                    <li><a href="#">키즈</a></li>

                </ul>

            </li>

            <li><a href="#">오피스</a>

                <ul class="sub">

                    <li><a href="#">책상</a></li>

                    <li><a href="#">의자</a></li>

                    <li><a href="#">파티션</a></li>

                </ul>

            </li>
            <li><a href="#">세계가구</a>

                <ul class="sub">

                    <li><a href="#">룩북</a></li>

                    <li><a href="#">쇼케이스</a></li>

                    <li><a href="#">브랜드</a></li>

                    <li><a href="#">디자이너</a></li>

                </ul>

            </li>
            <li><a href="#">공방</a>

                <ul class="sub">

                    <li><a href="#">아티스트</a></li>

                    <li><a href="#">제품</a></li>

                    <li><a href="#">클래스</a></li>

                    <li><a href="#">이벤트</a></li>

                </ul>

            </li>

        </ul>

    </nav>


</body>

</html>
